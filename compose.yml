services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
      - ./data/asoftfacade/ghost:/var/lib/ghost/content:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M

  adistantcloud:
    image: agiannif/adistantcloud:latest
    restart: always
    expose:
      - "1212"
    environment:
      GOMEMLIMIT: 20MiB
    volumes:
      - ./data/adistantcloud/assets:/assets
      - ./data/adistantcloud/configs:/configs
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 24M
        reservations:
          cpus: '0.05'
          memory: 12M

  asoftfacade:
    image: ghost:6-alpine
    restart: always
    expose:
      - "2368"
    environment:
      NODE_ENV: production
      url: https://${GHOST_DOMAIN}
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
      NODE_OPTIONS: "--max-old-space-size=380"
    volumes:
      - ./data/asoftfacade/ghost:/var/lib/ghost/content
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 512M
        reservations:
          cpus: '0.20'
          memory: 256M

  gokana:
    image: agiannif/gokana:latest
    restart: always
    expose:
      - "8080"
    environment:
      GOMEMLIMIT: 20MiB
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 24M
        reservations:
          cpus: '0.05'
          memory: 12M

  skinnyform:
    image: agiannif/skinnyform:latest
    restart: always
    expose:
      - "3000"
    environment:
      GOMEMLIMIT: 20MiB
      GMAIL_CLIENT: ${SF_GMAIL_CLIENT}
      GMAIL_SECRET: ${SF_GMAIL_SECRET}
      GMAIL_REFRESH: ${SF_GMAIL_REFRESH}
      EMAIL_USER: ${SF_EMAIL_USER}
      CLIENT_ORIGINS: ${SF_CLIENT_ORIGINS}
      CLIENT_EMAILS: ${SF_CLIENT_EMAILS}
      RATE_LIMIT_WINDOW: ${SF_RATE_LIMIT_WINDOW}
      RATE_LIMIT_MAX: ${SF_RATE_LIMIT_MAX}
      BLACKLISTED_DOMAINS: ${SF_BLACKLISTED_DOMAINS}
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 24M
        reservations:
          cpus: '0.05'
          memory: 12M

networks:
  default:
    enable_ipv6: true

volumes:
  caddy_data:
  caddy_config:
